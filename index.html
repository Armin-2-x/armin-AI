<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Armin AI</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class"
    };
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js/lib/common.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      font-family: "Vazirmatn", sans-serif;
      background: #f8fafc;
    }

    body {
      overflow: hidden;
    }

    .dark body {
      background: #0b0f14;
      color: #e5e7eb;
    }

    ::-webkit-scrollbar {
      width: 7px;
    }

    ::-webkit-scrollbar-thumb {
      background: #94a3b8;
      border-radius: 10px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #334155;
    }

    .message-content {
      line-height: 1.9;
    }

    .message-content p {
      margin: 0 0 12px;
    }

    .message-content p:last-child {
      margin-bottom: 0;
    }

    .message-content ul,
    .message-content ol {
      padding-right: 25px;
      margin: 10px 0;
    }

    .message-content li {
      margin: 4px 0;
    }

    .message-content pre {
      direction: ltr;
      text-align: left;
      background: #111827;
      color: #e5e7eb;
      border-radius: 12px;
      padding: 15px;
      overflow-x: auto;
      margin: 14px 0;
      position: relative;
    }

    .message-content code {
      font-family: Consolas, Monaco, monospace;
    }

    .message-content :not(pre) > code {
      background: #e2e8f0;
      color: #0f172a;
      padding: 2px 6px;
      border-radius: 6px;
      direction: ltr;
      display: inline-block;
    }

    .dark .message-content :not(pre) > code {
      background: #1e293b;
      color: #e2e8f0;
    }

    .code-wrapper {
      position: relative;
    }

    .copy-code {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      border: 0;
      background: rgba(255,255,255,.12);
      color: white;
      padding: 5px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px;
    }

    .copy-code:hover {
      background: rgba(255,255,255,.2);
    }

    .typing {
      display: inline-flex;
      gap: 4px;
      align-items: center;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: currentColor;
      border-radius: 50%;
      animation: blink 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        opacity: .25;
      }

      40% {
        opacity: 1;
      }
    }

    .sidebar-transition {
      transition: width .2s ease, transform .2s ease;
    }

    @media (max-width: 768px) {
      #sidebar {
        position: fixed;
        right: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        box-shadow: -10px 0 30px rgba(0,0,0,.12);
      }

      #sidebar.closed {
        transform: translateX(100%);
      }
    }
  </style>
</head>

<body>

<div id="app" class="h-screen flex bg-slate-50 dark:bg-[#0b0f14]">

  <!-- Sidebar -->
  <aside
    id="sidebar"
    class="sidebar-transition w-[280px] shrink-0 border-l border-slate-200 dark:border-slate-800 bg-white dark:bg-[#11161d] flex flex-col"
  >

    <div class="p-4 border-b border-slate-200 dark:border-slate-800">

      <div class="flex items-center justify-between mb-4">

        <div class="flex items-center gap-3">

          <div
            class="w-10 h-10 rounded-xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center font-bold text-lg"
          >
            A
          </div>

          <div>
            <div class="font-bold text-lg">
              Armin AI
            </div>

            <div class="text-xs text-slate-500">
              دستیار هوش مصنوعی
            </div>
          </div>

        </div>

        <button
          id="closeSidebar"
          class="md:hidden text-slate-500 hover:text-slate-900 dark:hover:text-white"
        >
          ✕
        </button>

      </div>

      <button
        id="newChatBtn"
        class="w-full rounded-xl bg-slate-900 hover:bg-slate-800 text-white py-3 px-4 transition"
      >
        + گفتگوی جدید
      </button>

    </div>

    <div class="flex-1 overflow-y-auto p-3">

      <div
        id="chatList"
        class="space-y-2"
      ></div>

      <div
        id="emptyChats"
        class="text-center text-sm text-slate-400 py-10"
      >
        هنوز گفتگویی وجود ندارد
      </div>

    </div>

    <div class="p-3 border-t border-slate-200 dark:border-slate-800">

      <button
        id="settingsBtn"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-sm"
      >
        ⚙️
        <span>تنظیمات</span>
      </button>

      <button
        id="themeBtn"
        class="w-full flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 text-sm"
      >
        🌙
        <span id="themeText">حالت تاریک</span>
      </button>

    </div>

  </aside>

  <!-- Main -->
  <main class="flex-1 min-w-0 flex flex-col">

    <!-- Header -->
    <header
      class="h-16 shrink-0 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-[#11161d] flex items-center justify-between px-4"
    >

      <div class="flex items-center gap-3">

        <button
          id="openSidebar"
          class="md:hidden w-10 h-10 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800"
        >
          ☰
        </button>

        <div>
          <div
            id="headerTitle"
            class="font-semibold"
          >
            گفتگوی جدید
          </div>

          <div class="text-xs text-slate-400">
            Armin AI
          </div>
        </div>

      </div>

      <div
        id="modelBadge"
        class="text-xs px-3 py-1.5 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-500"
      >
        Groq
      </div>

    </header>

    <!-- Messages -->
    <section
      id="messages"
      class="flex-1 overflow-y-auto"
    >

      <div
        id="welcome"
        class="min-h-full flex items-center justify-center px-4 py-10"
      >

        <div class="max-w-2xl w-full text-center">

          <div
            class="mx-auto mb-5 w-16 h-16 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 flex items-center justify-center text-2xl font-bold"
          >
            A
          </div>

          <h1 class="text-3xl font-bold mb-3">
            سلام! من Armin AI هستم
          </h1>

          <p class="text-slate-500 dark:text-slate-400 mb-8">
            دستیار هوش مصنوعی شما برای پاسخ به پرسش‌ها،
            نوشتن کد، ایده‌پردازی و تحلیل مطالب.
          </p>

          <div class="grid sm:grid-cols-2 gap-3">

            <button
              class="prompt-btn p-4 text-right rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              data-prompt="یک ایده برای پروژه وب با جاوااسکریپت پیشنهاد بده"
            >
              💡 یک ایده برای پروژه وب با جاوااسکریپت پیشنهاد بده
            </button>

            <button
              class="prompt-btn p-4 text-right rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              data-prompt="چطور می‌توانم در JavaScript تابع debounce بسازم؟"
            >
              💻 چطور می‌توانم در JavaScript تابع debounce بسازم؟
            </button>

            <button
              class="prompt-btn p-4 text-right rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              data-prompt="یک ایمیل رسمی برای ارائه گزارش کار بنویس"
            >
              📝 یک ایمیل رسمی برای ارائه گزارش کار بنویس
            </button>

            <button
              class="prompt-btn p-4 text-right rounded-xl border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
              data-prompt="اسمت چیه و چه کارهایی می‌توانی انجام دهی؟"
            >
              🤖 اسمت چیه و چه کارهایی می‌توانی انجام دهی؟
            </button>

          </div>

        </div>

      </div>

      <div
        id="messageContainer"
        class="max-w-4xl mx-auto px-4 py-6 space-y-6 hidden"
      ></div>

    </section>

    <!-- Input -->
    <div
      class="shrink-0 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-[#11161d] p-3"
    >

      <div class="max-w-4xl mx-auto">

        <form
          id="chatForm"
          class="flex items-end gap-2"
        >

          <textarea
            id="messageInput"
            rows="1"
            placeholder="پیامت را بنویس..."
            class="flex-1 resize-none max-h-40 rounded-2xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-[#0b0f14] px-4 py-3 outline-none focus:ring-2 focus:ring-slate-400 dark:focus:ring-slate-600"
          ></textarea>

          <button
            id="sendBtn"
            type="submit"
            class="w-12 h-12 shrink-0 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center"
          >
            ➤
          </button>

        </form>

        <div class="text-center text-[11px] text-slate-400 mt-2">
          Armin AI ممکن است گاهی پاسخ نادرست تولید کند.
        </div>

      </div>

    </div>

  </main>

</div>


<!-- Settings Modal -->
<div
  id="settingsModal"
  class="hidden fixed inset-0 z-[100] bg-black/50 items-center justify-center p-4"
>

  <div
    class="w-full max-w-lg rounded-2xl bg-white dark:bg-[#11161d] border border-slate-200 dark:border-slate-800 shadow-2xl"
  >

    <div class="p-5 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">

      <h2 class="font-bold text-lg">
        تنظیمات
      </h2>

      <button
        id="closeSettings"
        class="text-slate-500 hover:text-slate-900 dark:hover:text-white"
      >
        ✕
      </button>

    </div>

    <div class="p-5 space-y-5">

      <div>

        <label class="block text-sm font-medium mb-2">
          Worker URL
        </label>

        <input
          id="proxyUrl"
          type="url"
          class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-[#0b0f14] px-4 py-3 outline-none"
          placeholder="https://example.workers.dev"
        >

      </div>

      <div>

        <label class="block text-sm font-medium mb-2">
          مدل
        </label>

        <select
          id="modelSelect"
          class="w-full rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-[#0b0f14] px-4 py-3 outline-none"
        >
          <option value="openai/gpt-oss-120b">
            Armin AI — GPT OSS 120B
          </option>
        </select>

      </div>

    </div>

    <div class="p-5 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">

      <button
        id="cancelSettings"
        class="px-5 py-2.5 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800"
      >
        لغو
      </button>

      <button
        id="saveSettings"
        class="px-5 py-2.5 rounded-xl bg-slate-900 text-white"
      >
        ذخیره
      </button>

    </div>

  </div>

</div>


<script>
"use strict";

/* ================================
   CONFIG
================================ */

const APP_CONFIG = {

  proxyUrl:
    "https://armin-ai.armin-127-d.workers.dev",

  defaultModel:
    "openai/gpt-oss-120b",

  allowedModels: [
    "openai/gpt-oss-120b"
  ],

  storageKeys: {
    chats: "armin_ai_chats",
    activeChat: "armin_ai_active_chat",
    selectedModel: "armin_ai_model",
    proxyUrl: "armin_ai_proxy_url",
    theme: "armin_ai_theme"
  },

  systemPersona: `
تو Armin AI هستی.

اگر کاربر درباره نامت پرسید، بگو:
«من Armin AI هستم.»

تو یک دستیار هوش مصنوعی فارسی‌زبان، طبیعی، محترمانه، مفید و حرفه‌ای هستی.

می‌توانی در زمینه‌هایی مانند:
- پاسخ به پرسش‌ها
- برنامه‌نویسی
- تحلیل
- ایده‌پردازی
- نوشتن و ویرایش متن
- آموزش
- حل مسئله
کمک کنی.

اگر درباره فناوری یا مدل هوش مصنوعی از تو سؤال شد، صادق باش.
Armin AI از مدل‌های زبانی پیشرفته استفاده می‌کند و ادعا نکن که یک مدل زبانی از صفر ساخته شده است.

پاسخ‌ها را واضح، طبیعی و تا حد امکان مختصر بده.
در صورت نیاز از Markdown و کد استفاده کن.
`
};


/* ================================
   STATE
================================ */

const state = {

  chats: [],

  activeChatId: null,

  config: {
    proxyUrl: APP_CONFIG.proxyUrl,
    model: APP_CONFIG.defaultModel
  },

  theme: "light",

  sending: false
};


/* ================================
   ELEMENTS
================================ */

const $ = id =>
  document.getElementById(id);

const messages =
  $("messages");

const welcome =
  $("welcome");

const messageContainer =
  $("messageContainer");

const messageInput =
  $("messageInput");

const chatForm =
  $("chatForm");

const sendBtn =
  $("sendBtn");

const chatList =
  $("chatList");

const emptyChats =
  $("emptyChats");

const headerTitle =
  $("headerTitle");

const modelBadge =
  $("modelBadge");

const sidebar =
  $("sidebar");

const settingsModal =
  $("settingsModal");

const proxyUrlInput =
  $("proxyUrl");

const modelSelect =
  $("modelSelect");


/* ================================
   STORAGE
================================ */

function saveState() {

  localStorage.setItem(
    APP_CONFIG.storageKeys.chats,
    JSON.stringify(state.chats)
  );

  localStorage.setItem(
    APP_CONFIG.storageKeys.activeChat,
    state.activeChatId || ""
  );

  localStorage.setItem(
    APP_CONFIG.storageKeys.selectedModel,
    state.config.model
  );

  localStorage.setItem(
    APP_CONFIG.storageKeys.proxyUrl,
    state.config.proxyUrl
  );

  localStorage.setItem(
    APP_CONFIG.storageKeys.theme,
    state.theme
  );
}


function loadState() {

  try {

    const chats =
      localStorage.getItem(
        APP_CONFIG.storageKeys.chats
      );

    if (chats) {
      state.chats =
        JSON.parse(chats);
    }

  } catch {
    state.chats = [];
  }


  const activeChat =
    localStorage.getItem(
      APP_CONFIG.storageKeys.activeChat
    );

  if (
    activeChat &&
    state.chats.some(
      chat => chat.id === activeChat
    )
  ) {
    state.activeChatId =
      activeChat;
  }


  const storedModel =
    localStorage.getItem(
      APP_CONFIG.storageKeys.selectedModel
    );

  /*
    مهم:
    مدل‌های قدیمی مثل Gemini را حذف می‌کنیم.
  */

  if (
    APP_CONFIG.allowedModels.includes(
      storedModel
    )
  ) {
    state.config.model =
      storedModel;
  } else {

    state.config.model =
      APP_CONFIG.defaultModel;

    localStorage.setItem(
      APP_CONFIG.storageKeys.selectedModel,
      state.config.model
    );
  }


  const storedProxy =
    localStorage.getItem(
      APP_CONFIG.storageKeys.proxyUrl
    );

  if (storedProxy) {
    state.config.proxyUrl =
      storedProxy;
  }


  const storedTheme =
    localStorage.getItem(
      APP_CONFIG.storageKeys.theme
    );

  if (
    storedTheme === "dark" ||
    storedTheme === "light"
  ) {
    state.theme =
      storedTheme;
  }

}


/* ================================
   THEME
================================ */

function applyTheme() {

  if (state.theme === "dark") {

    document.documentElement
      .classList.add("dark");

    $("themeText").textContent =
      "حالت روشن";

  } else {

    document.documentElement
      .classList.remove("dark");

    $("themeText").textContent =
      "حالت تاریک";
  }

}


/* ================================
   CHAT
================================ */

function createChat() {

  const chat = {

    id:
      Date.now().toString(),

    title:
      "گفتگوی جدید",

    messages: [],

    createdAt:
      Date.now()

  };

  state.chats.unshift(chat);

  state.activeChatId =
    chat.id;

  saveState();

  renderChats();

  renderMessages();

  messageInput.focus();

}


function getActiveChat() {

  return state.chats.find(
    chat =>
      chat.id === state.activeChatId
  );

}


function ensureChat() {

  let chat =
    getActiveChat();

  if (!chat) {

    createChat();

    chat =
      getActiveChat();
  }

  return chat;
}


/* ================================
   CHAT LIST
================================ */

function renderChats() {

  chatList.innerHTML = "";

  emptyChats.style.display =
    state.chats.length
      ? "none"
      : "block";

  for (const chat of state.chats) {

    const button =
      document.createElement("button");

    button.className =
      "w-full text-right px-3 py-3 rounded-xl hover:bg-slate-100 dark:hover:bg-slate-800 transition " +
      (
        chat.id === state.activeChatId
          ? "bg-slate-100 dark:bg-slate-800"
          : ""
      );

    button.innerHTML = `
      <div class="font-medium text-sm truncate">
        ${escapeHtml(chat.title)}
      </div>

      <div class="text-[11px] text-slate-400 mt-1">
        ${chat.messages.length} پیام
      </div>
    `;

    button.addEventListener(
      "click",
      () => {

        state.activeChatId =
          chat.id;

        saveState();

        renderChats();

        renderMessages();

        closeMobileSidebar();

      }
    );

    chatList.appendChild(button);
  }

}


/* ================================
   MESSAGE RENDER
================================ */

function renderMessages() {

  const chat =
    getActiveChat();

  messageContainer.innerHTML = "";

  if (!chat || chat.messages.length === 0) {

    welcome.classList.remove("hidden");

    messageContainer.classList.add("hidden");

    headerTitle.textContent =
      chat
        ? chat.title
        : "گفتگوی جدید";

    return;
  }

  welcome.classList.add("hidden");

  messageContainer.classList.remove("hidden");

  headerTitle.textContent =
    chat.title;


  for (const message of chat.messages) {

    appendMessageToDOM(
      message.role,
      message.content
    );

  }

  scrollToBottom();

}


/* ================================
   ADD MESSAGE
================================ */

function appendMessageToDOM(
  role,
  content
) {

  const wrapper =
    document.createElement("div");

  const isUser =
    role === "user";

  wrapper.className =
    "flex " +
    (
      isUser
        ? "justify-start"
        : "justify-end"
    );


  const bubble =
    document.createElement("div");

  bubble.className =
    "max-w-[90%] rounded-2xl px-4 py-3 " +
    (
      isUser
        ? "bg-slate-900 text-white"
        : "bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100"
    );


  if (isUser) {

    bubble.textContent =
      content;

  } else {

    const contentDiv =
      document.createElement("div");

    contentDiv.className =
      "message-content";

    contentDiv.innerHTML =
      renderMarkdown(content);

    bubble.appendChild(
      contentDiv
    );

  }


  wrapper.appendChild(
    bubble
  );

  messageContainer.appendChild(
    wrapper
  );

  if (!isUser) {
    addCodeCopyButtons(
      bubble
    );
  }

  return bubble;

}


/* ================================
   MARKDOWN
================================ */

function renderMarkdown(text) {

  if (
    typeof marked === "undefined"
  ) {
    return escapeHtml(text)
      .replace(/\n/g, "<br>");
  }

  return marked.parse(
    text || ""
  );

}


/* ================================
   CODE COPY
================================ */

function addCodeCopyButtons(
  container
) {

  const blocks =
    container.querySelectorAll(
      "pre"
    );

  blocks.forEach(
    pre => {

      if (
        pre.parentElement.classList.contains(
          "code-wrapper"
        )
      ) {
        return;
      }

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "code-wrapper";

      pre.parentNode.insertBefore(
        wrapper,
        pre
      );

      wrapper.appendChild(
        pre
      );

      const button =
        document.createElement("button");

      button.className =
        "copy-code";

      button.textContent =
        "کپی";

      button.addEventListener(
        "click",
        async () => {

          const code =
            pre.querySelector("code");

          await navigator.clipboard.writeText(
            code
              ? code.innerText
              : pre.innerText
          );

          button.textContent =
            "کپی شد";

          setTimeout(
            () => {
              button.textContent =
                "کپی";
            },
            1200
          );

        }
      );

      wrapper.appendChild(
        button
      );

    }
  );

}


/* ================================
   SEND
================================ */

async function sendMessage(
  text
) {

  text =
    String(text || "").trim();

  if (!text || state.sending) {
    return;
  }


  const chat =
    ensureChat();


  if (chat.messages.length === 0) {

    chat.title =
      text.length > 35
        ? text.slice(0, 35) + "..."
        : text;

  }


  chat.messages.push({
    role: "user",
    content: text
  });


  saveState();

  renderChats();

  renderMessages();


  state.sending = true;

  sendBtn.disabled = true;

  messageInput.disabled = true;


  const assistantBubble =
    createStreamingBubble();


  try {

    const contentsPayload =
      chat.messages.map(
        message => ({
          role:
            message.role === "assistant"
              ? "model"
              : "user",

          parts: [
            {
              text:
                message.content
            }
          ]
        })
      );


    const endpointUrl =
      state.config.proxyUrl
        .replace(/\/+$/, "")
      + "/api/chat";


    const response =
      await fetch(
        endpointUrl,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              model:
                state.config.model,

              contents:
                contentsPayload,

              systemInstruction:
                APP_CONFIG.systemPersona,

              stream:
                true
            })
        }
      );


    if (!response.ok) {

      let errorText =
        await response.text();

      try {

        const errorJson =
          JSON.parse(errorText);

        errorText =
          errorJson?.error?.message ||
          errorJson?.message ||
          errorText;

      } catch {}

      throw new Error(
        errorText ||
        `خطای سرور: ${response.status}`
      );

    }


    if (!response.body) {
      throw new Error(
        "پاسخی از سرور دریافت نشد."
      );
    }


    /*
      Groq / OpenAI-compatible SSE
    */

    const reader =
      response.body.getReader();

    const decoder =
      new TextDecoder("utf-8");

    let buffer = "";

    let fullText = "";

    while (true) {

      const {
        value,
        done
      } =
        await reader.read();


      if (done) {
        break;
      }


      buffer +=
        decoder.decode(
          value,
          {
            stream: true
          }
        );


      const lines =
        buffer.split("\n");

      buffer =
        lines.pop() || "";


      for (
        const rawLine of lines
      ) {

        const line =
          rawLine.trim();


        if (!line) {
          continue;
        }


        if (
          !line.startsWith(
            "data:"
          )
        ) {
          continue;
        }


        const data =
          line.slice(5).trim();


        if (
          data === "[DONE]"
        ) {
          continue;
        }


        try {

          const json =
            JSON.parse(data);


          const delta =
            json
              ?.choices?.[0]
              ?.delta
              ?.content;


          if (
            typeof delta ===
            "string"
          ) {

            fullText +=
              delta;

            updateStreamingBubble(
              assistantBubble,
              fullText
            );

            scrollToBottom();
          }

        } catch {

          /*
            بعضی chunkها ممکن است
            کامل JSON نباشند.
            در این حالت نادیده گرفته می‌شوند.
          */

        }

      }

    }


    if (!fullText.trim()) {

      throw new Error(
        "پاسخی از سرور دریافت نشد."
      );

    }


    chat.messages.push({
      role: "assistant",
      content: fullText
    });


    saveState();

    renderChats();

  } catch (error) {

    assistantBubble.innerHTML = `
      <div class="text-red-500">
        خطا: ${escapeHtml(
          error.message ||
          "خطای نامشخص"
        )}
      </div>
    `;

  } finally {

    state.sending = false;

    sendBtn.disabled = false;

    messageInput.disabled = false;

    messageInput.focus();

    scrollToBottom();

  }

}


/* ================================
   STREAMING BUBBLE
================================ */

function createStreamingBubble() {

  welcome.classList.add("hidden");

  messageContainer.classList.remove(
    "hidden"
  );


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "flex justify-end";


  const bubble =
    document.createElement("div");

  bubble.className =
    "max-w-[90%] rounded-2xl px-4 py-3 bg-slate-100 dark:bg-slate-800 text-slate-900 dark:text-slate-100";


  bubble.innerHTML = `
    <div class="typing">
      <span></span>
      <span></span>
      <span></span>
    </div>
  `;


  wrapper.appendChild(
    bubble
  );

  messageContainer.appendChild(
    wrapper
  );


  return bubble;

}


function updateStreamingBubble(
  bubble,
  text
) {

  bubble.innerHTML = `
    <div class="message-content">
      ${renderMarkdown(text)}
    </div>
  `;

  addCodeCopyButtons(
    bubble
  );

}


/* ================================
   UTILITIES
================================ */

function escapeHtml(text) {

  return String(text)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function scrollToBottom() {

  messages.scrollTo({
    top:
      messages.scrollHeight,

    behavior:
      "smooth"
  });

}


/* ================================
   SETTINGS
================================ */

function openSettings() {

  proxyUrlInput.value =
    state.config.proxyUrl;

  modelSelect.value =
    state.config.model;

  settingsModal.classList.remove(
    "hidden"
  );

  settingsModal.classList.add(
    "flex"
  );

}


function closeSettings() {

  settingsModal.classList.add(
    "hidden"
  );

  settingsModal.classList.remove(
    "flex"
  );

}


/* ================================
   SIDEBAR
================================ */

function openMobileSidebar() {

  sidebar.classList.remove(
    "closed"
  );

}


function closeMobileSidebar() {

  if (
    window.innerWidth <= 768
  ) {
    sidebar.classList.add(
      "closed"
    );
  }

}


/* ================================
   EVENTS
================================ */

$("newChatBtn")
  .addEventListener(
    "click",
    createChat
  );


$("settingsBtn")
  .addEventListener(
    "click",
    openSettings
  );


$("closeSettings")
  .addEventListener(
    "click",
    closeSettings
  );


$("cancelSettings")
  .addEventListener(
    "click",
    closeSettings
  );


$("saveSettings")
  .addEventListener(
    "click",
    () => {

      const url =
        proxyUrlInput.value.trim();

      if (url) {

        state.config.proxyUrl =
          url.replace(/\/+$/, "");

      }


      state.config.model =
        "openai/gpt-oss-120b";


      saveState();

      modelBadge.textContent =
        "Groq";

      closeSettings();

    }
  );


$("themeBtn")
  .addEventListener(
    "click",
    () => {

      state.theme =
        state.theme === "dark"
          ? "light"
          : "dark";

      applyTheme();

      saveState();

    }
  );


$("openSidebar")
  .addEventListener(
    "click",
    openMobileSidebar
  );


$("closeSidebar")
  .addEventListener(
    "click",
    closeMobileSidebar
  );


chatForm.addEventListener(
  "submit",
  event => {

    event.preventDefault();

    const text =
      messageInput.value.trim();

    if (!text) {
      return;
    }

    messageInput.value = "";

    messageInput.style.height =
      "auto";

    sendMessage(text);

  }
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      chatForm.requestSubmit();

    }

  }
);


messageInput.addEventListener(
  "input",
  () => {

    messageInput.style.height =
      "auto";

    messageInput.style.height =
      Math.min(
        messageInput.scrollHeight,
        160
      ) + "px";

  }
);


document
  .querySelectorAll(".prompt-btn")
  .forEach(
    button => {

      button.addEventListener(
        "click",
        () => {

          sendMessage(
            button.dataset.prompt
          );

        }
      );

    }
  );


settingsModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      settingsModal
    ) {
      closeSettings();
    }

  }
);


/* ================================
   INIT
================================ */

loadState();

applyTheme();

renderChats();

renderMessages();

modelBadge.textContent =
  "Groq";

if (
  window.innerWidth <= 768
) {
  sidebar.classList.add(
    "closed"
  );
}

</script>

</body>
</html>
